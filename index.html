<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Калькулятор Lechner SPC LVT</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;color:#18202a;margin:0}.wrap{max-width:760px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #dde2e8;border-radius:16px;padding:20px;margin-bottom:16px}h1{margin:0 0 6px;font-size:26px}.sub,.muted{color:#667085}.empty{padding:22px}.empty strong{font-size:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}label{display:block;font-weight:bold;font-size:14px;margin-bottom:7px}input,select{width:100%;height:46px;border:1px solid #cfd5dd;border-radius:10px;padding:0 12px;font-size:16px;background:white;box-sizing:border-box}.result{background:#f7f9fb;border:1px solid #dce2e8;border-radius:13px;padding:16px;margin-top:12px}.row{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #e2e6eb}.row:last-child{border:0}.badge{background:#e8eefc;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:bold}.muted{font-size:13px;line-height:1.45}.error{color:#b42318;font-size:13px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="card"><h1>Калькулятор укладки</h1><div class="sub">SPC / LVT / ПВХ — подбор грунта и клея</div>
<div class="grid">
<div class="field"><label>Покрытие</label><select id="cover"><option>SPC</option><option>LVT</option><option>ПВХ</option></select></div>
<div class="field"><label>Площадь, м²</label><input id="area" type="number" min="0" step="0.1" placeholder="Например, 120"></div></div>
<div class="grid">
<div class="field"><label>Что нужно сделать с основанием?</label><select id="task"><option value="dust">Обеспылить</option><option value="strength">Укрепить</option></select></div>
<div class="field"><label>Поверхность</label><select id="surface"><option value="floor">Пол</option><option value="wall">Вертикальная поверхность</option></select></div></div>
<div class="grid">
<div class="field"><label>Тёплый пол</label><select id="warm"><option value="no">Нет</option><option value="yes">Да</option></select></div>
<div class="field"><label>Влажная зона</label><select id="wet"><option value="no">Нет</option><option value="yes">Да</option></select></div></div>
</div>
<div id="error" class="error"></div><div id="result" class="card"></div></div>
<script>
(function(){
"use strict";
var products={
 G:{name:"GOMMAPUR 2K",covers:["SPC","LVT","ПВХ"],sizes:[10],warm:true,wet:true,wall:false},
 P:{name:"POLIFLEX SPC",covers:["SPC","LVT","ПВХ"],sizes:[5,15],warm:true,wet:true,wall:true},
 K:{name:"HYCOL KD FIBER",covers:["LVT","ПВХ"],sizes:[5,18],warm:true,wet:false,wall:true},
 H:{name:"HYCOSTIK FIBER",covers:["LVT"],sizes:[5,18],warm:true,wet:false,wall:false}
};
function $(id){return document.getElementById(id)}
function fmt(n){return n.toFixed(1).replace(".",",")}
function roundHalfUp(n){return Math.floor(n+0.5)}
function normalPack(kg,sizes){
 var best=null;
 sizes.forEach(function(size){
   var count=Math.max(1,roundHalfUp(kg/size));
   var total=count*size;
   if(!best || total-kg<best.total-kg) best={items:[[count,size]],total:total};
 });
 return best;
}
function polyflexPack(kg){
  var need=Math.max(0,Number(kg)||0);
  var n15=Math.floor(need/15);
  var remainder=need-n15*15;
  var n5=Math.ceil(remainder/5);

  n15+=Math.floor(n5/3);
  n5=n5%3;

  var items=[];
  if(n15>0) items.push([n15,15]);
  if(n5>0) items.push([n5,5]);

  return {items:items,total:n15*15+n5*5};
}
function specialPack(kg){
  var need=Math.max(0,Number(kg)||0);
  var n18=Math.floor(need/18);
  var remainder=need-n18*18;
  var n5=Math.ceil(remainder/5);

  n18+=Math.floor(n5/3);
  n5=n5%3;

  var items=[];
  if(n18>0) items.push([n18,18]);
  if(n5>0) items.push([n5,5]);

  return {items:items,total:n18*18+n5*5};
}
function packText(p){
 return p.items.map(function(x){return x[1]+" кг — "+x[0]+" шт."}).join(" + ");
}
function calc(){
 var area=Number($("area").value);
 var cover=$("cover").value;
 var task=$("task").value;
 var surface=$("surface").value;
 var warm=$("warm").value==="yes";
 var wet=$("wet").value==="yes";

 if(!Number.isFinite(area) || area<=0){
   $("error").textContent="";
   $("result").innerHTML='<div class="result empty"><strong style="font-size:18px">Введите площадь объекта</strong><div class="muted" style="margin-top:6px">Укажите площадь в м², чтобы получить расчёт материалов.</div></div>';
   return;
 }
 $("error").textContent="";

 var primerLiters=area*0.12;
 var primerPacks=Math.max(1,roundHalfUp(primerLiters/5));
 var primers=task==="dust"?[{name:"PRIMER D PLUS"}]:[{name:"PU PRIMER 150"},{name:"PRIMER SF"}];

 var glueKg=area*(cover==="SPC"?0.6:0.32);

 var list=Object.keys(products).map(function(id){
   var p=products[id];
   return {id:id,name:p.name,covers:p.covers,sizes:p.sizes,warm:p.warm,wet:p.wet,wall:p.wall};
 }).filter(function(p){
   return p.covers.indexOf(cover)>=0 &&
          (!warm || p.warm) &&
          (!wet || p.wet) &&
          (surface!=="wall" || p.wall) &&
          (task!=="strength" || p.id==="G" || p.id==="P");
 });

 var priority={P:1,G:2,K:3,H:4};
 list.sort(function(a,b){return priority[a.id]-priority[b.id]});

 var html='<div style="font-size:28px;font-weight:800;margin:0 0 12px;text-transform:uppercase">ГРУНТ</div>';
 primers.forEach(function(pr){
   html+='<div class="result"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">';
   html+='<div><strong style="font-size:20px">'+pr.name+'</strong></div>';
   html+='<span class="badge">5 л — '+primerPacks+' шт.</span></div>';
   html+='<div class="row"><span>Расчётный расход</span><strong>'+fmt(primerLiters)+' л</strong></div>';
   html+='<div class="muted">Норма расчёта: 120 мл/м²</div></div>';
 });

 if(!list.length){
   html+='<div class="result"><strong>Подходящего клея не найдено</strong><div class="muted" style="margin-top:6px">По выбранным условиям в актуальной базе нет подходящего варианта.</div></div>';
 }else{
   html+='<div style="font-size:26px;font-weight:800;margin:20px 0 10px;text-transform:uppercase">КЛЕЙ</div>';
   list.forEach(function(p,index){
     var pkg=p.id==="P"?polyflexPack(glueKg):((p.id==="K"||p.id==="H")?specialPack(glueKg):normalPack(glueKg,p.sizes));
     html+='<div class="result"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">';
     html+='<div><strong style="font-size:20px">'+p.name+'</strong></div>';
     html+='<span class="badge">'+packText(pkg)+'</span></div>';
     html+='<div class="row"><span>Расчётный расход</span><strong>'+fmt(glueKg)+' кг</strong></div>';
     html+='<div class="row"><span>Материал в упаковках</span><strong>'+fmt(pkg.total)+' кг</strong></div>';
     html+='<div class="muted">Норма расчёта: '+(cover==="SPC"?600:320)+' г/м²</div></div>';
   });
 }
 html+='<p class="muted" style="margin:16px 0 0">Перед началом работ необходимо проверить основание по ровности, влажности и прочности.</p>';
 $("result").innerHTML=html;
}
["cover","area","task","surface","warm","wet"].forEach(function(id){
 $(id).addEventListener("input",calc);
 $(id).addEventListener("change",calc);
});
calc();
})();
</script>
